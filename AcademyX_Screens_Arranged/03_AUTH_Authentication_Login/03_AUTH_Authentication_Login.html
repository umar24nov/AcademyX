<style>
        body {
            background-color: #09090b;
            color: #e5e1e4;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            transition: box-shadow 150ms ease-out;
        }

        .login-card:hover {
            box-shadow: 0px 0px 20px rgba(99, 102, 241, 0.08);
        }

        .input-field {
            background-color: #09090b;
            border: 1px solid #27272a;
            transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
        }

        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0px 0px 8px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .primary-btn {
            background-color: #6366f1;
            color: #fafafa;
            transition: transform 150ms ease-out, opacity 150ms ease-out;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #e5e1e4;
            transition: background-color 150ms ease-out;
        }

        .secondary-btn:hover {
            background-color: #1f1f23;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, rgba(9, 9, 11, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>

<body class="flex flex-col min-h-screen">
<div class="ambient-glow"></div>
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
<div class="login-card w-full max-w-[420px] p-8 rounded-xl flex flex-col gap-8">
<!-- Header -->
<div class="flex flex-col gap-2 text-center">
<div class="flex justify-center mb-2">
<span class="material-symbols-outlined text-indigo-accent text-4xl" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-text-heading tracking-tight">
                    Welcome back to AcademyX

<p class="font-body-sm text-body-sm text-text-muted">
                    Enter your credentials to access your dashboard.
                </p>
</div>
<!-- SSO Options -->
<div class="flex flex-col gap-3">
<button class="secondary-btn w-full py-2.5 rounded-lg flex items-center justify-center gap-3 font-button text-button group">

<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-4">

</div>
<div class="flex flex-col gap-1.5 text-right">
<div class="flex justify-between">
<label class="font-button text-button text-on-surface" for="password">Password</label>

</div>
</div>
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-border-subtle bg-background text-indigo-accent focus:ring-indigo-accent focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-text-muted" for="remember">Keep me logged in for 30 days</label>
</div>
<button class="primary-btn w-full py-3 rounded-lg font-button text-button font-semibold" type="submit">
                    Sign in to AcademyX
                </button>
</form>

<p class="text-center font-body-sm text-body-sm text-text-muted">

</div>
<p class="font-body-sm text-body-sm text-text-muted opacity-80">© 2024 AcademyX. All rights reserved.</p>
</div>
</footer>
<script>
        // Simple Micro-interaction: Focus first input on load
        window.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            if (emailInput) {
                // Delay slightly for smoother visual entrance if needed
                setTimeout(() => emailInput.focus(), 500);
            }
        });

        // Add subtle mouse-tracking glow to the card
        const card = document.querySelector('.login-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Check if mouse is near or over the card
            if (x > -50 && x < rect.width + 50 && y > -50 && y < rect.height + 50) {
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            }
        });
    </script>
