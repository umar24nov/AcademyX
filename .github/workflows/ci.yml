name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test (boot + /health)
        run: |
          node dist/server.js &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/health" >/dev/null 2>&1; then
              echo "Server is healthy"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          echo "Server did not become healthy"
          exit 1
        env:
          NODE_ENV: production
          PORT: 5000
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
          JWT_ACCESS_SECRET: smoke-access-secret-at-least-16-chars
          JWT_REFRESH_SECRET: smoke-refresh-secret-at-least-16-char
          CORS_ORIGIN: http://localhost:3000

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
